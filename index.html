<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stumps & Sixes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Work+Sans:wght@400;600&display=swap">
<style>
/* Layout: one-screen game. Scoreboard on top, floodlit pitch canvas in the middle, thumb controls at the bottom. */
:root{
  --bg:#0f1730; --panel:#18234a; --panel2:#223163; --line:#394a8a;
  --fg:#eef1fb; --mute:#a3afd6; --ball:#e0412f; --ball-ink:#fff;
  --brass:#f0bf55; --turf:#2e8b57; --ok:#47d089; --bad:#ff6a5a;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 var(--body);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;max-width:1100px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;justify-content:space-between}
.board{display:flex;align-items:baseline;gap:10px;min-width:0}
.tm{font:800 15px var(--display);letter-spacing:.12em;color:var(--brass);text-transform:uppercase}
.sc{font:800 44px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sc i{font-style:normal;color:var(--mute);margin:0 2px}
.ov{font:600 20px var(--display);color:var(--mute);font-variant-numeric:tabular-nums}
.info{font-size:13px;color:var(--mute);flex:1 1 140px;min-width:0}
.info b{color:var(--fg);font-weight:600}
.tools{display:flex;gap:6px}
.tbtn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;min-height:34px}
.tbtn:hover{background:var(--panel2)}
#chips{display:flex;gap:5px;min-height:24px;flex-wrap:wrap;align-items:center;width:100%}
#chips span.lab{font:600 12px var(--display);letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin-right:2px}
.chip{min-width:24px;height:24px;border-radius:12px;display:inline-grid;place-items:center;font:700 13px var(--display);background:var(--panel2);border:1px solid var(--line);padding:0 4px;box-sizing:border-box}
.chip.f{background:var(--brass);color:#2a2000;border-color:var(--brass)}
.chip.s{background:var(--ball);color:#fff;border-color:var(--ball)}
.chip.w{background:#fff;color:var(--ball);border-color:#fff}
.chip.x{border-style:dashed}

#sb{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;font-variant-numeric:tabular-nums}
#sb>div{min-width:0}
#sb .h{font:600 11px var(--display);letter-spacing:.14em;color:var(--mute);text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
#sb .h b{color:var(--fg);font-weight:600}
#sb .r{display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
#sb .r span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
#sb .r span:last-child{color:var(--mute);flex:none}
#sb .cur span{color:var(--brass);font-weight:600}
#sb .oth{color:var(--mute);font-size:11px;line-height:1.3;max-height:30px;overflow:auto}
#sb .oth b{color:var(--fg);font-weight:600}
#stage{position:relative;flex:1 1 0;min-height:160px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#1b2552}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:0;right:0;top:34%;text-align:center;font:800 clamp(44px,12vw,96px)/1 var(--display);letter-spacing:.04em;text-transform:uppercase;pointer-events:none;opacity:0;text-shadow:0 3px 0 rgba(0,0,0,.35)}
#toast.show{animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.08)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#comm{position:absolute;left:8px;right:8px;bottom:6px;font-size:13px;line-height:1.3;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.8);display:flex;flex-direction:column;gap:2px}
#comm div{background:rgba(10,16,40,.55);border-radius:6px;padding:3px 8px;width:fit-content;max-width:100%}
#comm div:not(:last-child){opacity:.6}

#controls{display:grid;gap:8px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1 1 150px;min-width:0}
.lbl{font:600 12px var(--display);letter-spacing:.14em;color:var(--mute);text-transform:uppercase;display:flex;justify-content:space-between;margin-bottom:3px}
.lbl output{color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--brass);height:28px;margin:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;border-right:1px solid var(--line);padding:9px 6px;font-size:13px;min-height:40px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--brass);color:#2a2000;font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--ball);border-color:var(--ball);color:var(--ball-ink);font:800 22px var(--display);letter-spacing:.1em;text-transform:uppercase}
.btn.primary:active{transform:scale(.97)}
.btn.toggle[aria-pressed=true]{background:var(--brass);color:#2a2000;border-color:var(--brass)}
#swing{flex:2 1 160px;min-height:60px}
#hint{font-size:12px;color:var(--mute);text-align:center;min-height:16px}

#overlay{position:fixed;inset:0;background:rgba(8,12,28,.86);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:560px;max-height:100%;overflow:auto;box-sizing:border-box;display:grid;gap:14px}
.card h1{font:800 clamp(44px,11vw,72px)/.9 var(--display);margin:0;letter-spacing:.02em;text-transform:uppercase}
.card h1 em{font-style:normal;color:var(--ball)}
.card h2{font:800 30px/1 var(--display);margin:0;letter-spacing:.04em;text-transform:uppercase}
.card p{margin:0;color:var(--mute)}
.card .big{font:800 40px/1 var(--display);color:var(--fg)}
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.team{border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2);text-align:left;display:grid;gap:2px}
.team[aria-pressed=true]{border-color:var(--brass)}
.team b{font:800 20px var(--display);letter-spacing:.06em}
.team span{font-size:12px;color:var(--mute)}
.team i{display:block;height:6px;border-radius:3px;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font:600 12px var(--display);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.scroll{overflow-x:auto}
.statline{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.statline b{color:var(--brass);font:800 20px var(--display)}
  .card .r{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card .r span:last-child{color:var(--fg)}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}
ul.help{margin:0;padding-left:18px;color:var(--mute);display:grid;gap:6px}
ul.help b{color:var(--fg)}
@media (max-width:520px){.sc{font-size:38px}.card{padding:16px}}
@media (prefers-reduced-motion:reduce){#toast.show{animation:none;opacity:1}}
</style><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>


<div id="app">
  <header id="hud">
    <div class="board"><span class="tm" id="tmName">Stumps &amp; Sixes</span><span class="sc"><b id="runs">0</b><i>/</i><b id="wkts">0</b></span><span class="ov" id="overs">0.0</span></div>
    <div class="info" id="info"></div>
    <div class="tools">
      <button class="tbtn" id="btnCard" type="button">Card</button>
      <button class="tbtn" id="btnMute" type="button" aria-pressed="false">Sound on</button>
      <button class="tbtn" id="btnMenu" type="button">Menu</button>
    </div>
    <div id="chips"></div>
  </header>
  <section id="sb" aria-label="Scoreboard" hidden></section>
  <div id="stage">
    <canvas id="cv" aria-label="Cricket pitch, view from behind the batter"></canvas>
    <div id="toast" aria-live="polite"></div>
    <div id="comm" aria-live="polite"></div>
  </div>
  <section id="controls">
    <div id="ctlBat" hidden>
      <div class="row">
        <div class="grow">
          <div class="lbl"><span>Aim &nbsp;(leg ← → off)</span><output id="aimOut">Straight</output></div>
          <input type="range" id="aim" min="-90" max="90" step="1" value="0" aria-label="Shot direction">
        </div>
        <button class="btn toggle" id="loft" type="button" aria-pressed="false">Loft</button>
        <button class="btn primary" id="swing" type="button">Swing</button>
      </div>
    </div>
    <div id="ctlBowl" hidden>
      <div class="row">
        <div class="grow"><div class="lbl"><span>Length</span></div>
          <div class="seg" id="segLen"><button type="button" data-v="yorker" aria-pressed="false">Yorker</button><button type="button" data-v="full" aria-pressed="false">Full</button><button type="button" data-v="good" aria-pressed="true">Good</button><button type="button" data-v="short" aria-pressed="false">Short</button></div></div>
        <div class="grow"><div class="lbl"><span>Speed</span></div>
          <div class="seg" id="segSpd"><button type="button" data-v="slow" aria-pressed="false">Slower</button><button type="button" data-v="stock" aria-pressed="true">Stock</button><button type="button" data-v="quick" aria-pressed="false">Quick</button></div></div>
      </div>
      <div class="row" style="margin-top:8px">
        <div class="grow"><div class="lbl"><span>Line &nbsp;(leg ← → off)</span><output id="lineOut">Off stump</output></div>
          <input type="range" id="line" min="-100" max="140" step="1" value="25" aria-label="Line of delivery"></div>
        <div class="grow"><div class="lbl"><span>Field</span></div>
          <div class="seg" id="segFld"><button type="button" data-v="att" aria-pressed="false">Attack</button><button type="button" data-v="bal" aria-pressed="true">Balanced</button><button type="button" data-v="def" aria-pressed="false">Defend</button></div></div>
        <button class="btn primary" id="bowl" type="button">Bowl</button>
      </div>
    </div>
    <div id="ctlWait"><div class="row" style="justify-content:center"><span style="color:var(--mute)">Choose a mode to start playing.</span></div></div>
    <div id="hint"></div>
  </section>
  <div id="overlay" hidden></div>
</div>

<script>
'use strict';
/* ===== utilities ===== */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=()=>Math.random();
const rr=(a,b)=>a+(b-a)*rnd();
const pick=a=>a[Math.floor(rnd()*a.length)];
const randn=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2831853*v);};
const rad=d=>d*Math.PI/180;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const store={
  get(k,d){try{const v=localStorage.getItem('sns_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('sns_'+k,JSON.stringify(v));}catch(e){}}
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const oversText=b=>Math.floor(b/6)+'.'+(b%6);

/* ===== teams & players ===== */
const TEAMS=[
  {id:'DKS',name:'Deccan Strikers',c1:'#f0bf55',c2:'#233a8a'},
  {id:'CKG',name:'Coastal Kings',c1:'#35c2d6',c2:'#0e4a5c'},
  {id:'NLN',name:'Northern Lions',c1:'#ef5a3c',c2:'#5b1a14'},
  {id:'HBH',name:'Harbour Hawks',c1:'#9bdc6a',c2:'#1d4a2b'}
];
const FIRST=['Arjun','Rohan','Kabir','Vikram','Imran','Dev','Sameer','Nikhil','Rahul','Aryan','Tarun','Zaheer','Mohit','Pranav','Karan','Siddharth','Rizwan','Harsh','Yash','Ankit','Farhan','Jayant','Ishan','Varun'];
const LAST=['Rao','Khan','Reddy','Naidu','Sharma','Iyer','Menon','Patel','Verma','Gill','Bose','Kulkarni','Das','Nair','Joshi','Mirza','Singh','Chauhan','Pillai','Ahmed','Yadav','Thakur','Mehta','Shetty'];
const BAT_BASE=[.88,.84,.8,.76,.7,.64,.56,.46,.4,.34,.3];
const BOWL_SLOTS=[[10,'fast',.82],[9,'fast',.78],[8,'medium',.7],[7,'spin',.74],[6,'spin',.66],[5,'medium',.6]];
function genTeam(ti){
  const used=new Set(),players=[];
  for(let i=0;i<11;i++){
    let n;do{n=pick(FIRST)+' '+pick(LAST);}while(used.has(n));used.add(n);
    players.push({i,name:n,bat:clamp(BAT_BASE[i]+rr(-.04,.04),.2,.95),bowl:null});
  }
  BOWL_SLOTS.forEach(s=>{players[s[0]].bowl={type:s[1],skill:clamp(s[2]+rr(-.05,.05),.4,.95)};});
  return {ti,team:TEAMS[ti],players};
}

/* ===== audio (WebAudio, started by the first tap) ===== */
const Snd={ctx:null,on:true,
  init(){if(this.ctx)return;try{const A=window.AudioContext||window.webkitAudioContext;if(A)this.ctx=new A();}catch(e){}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  tone(f,dur,type,vol,slide){if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.02);},
  noise(dur,vol,freq,type,swell){if(!this.on||!this.ctx)return;const c=this.ctx,n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq||1500;const g=c.createGain(),t=c.currentTime;if(swell){g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.3);g.gain.linearRampToValueAtTime(.001,t+dur);}else{g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);}s.connect(f).connect(g).connect(c.destination);s.start(t);},
  click(){this.tone(620,.06,'square',.05);},
  hit(q){this.noise(.07,.35+q*.3,1800+q*1200,'bandpass');this.tone(170,.09,'triangle',.2,.5);},
  edge(){this.noise(.05,.3,3000,'highpass');},
  stumps(){this.noise(.25,.5,900,'bandpass');this.tone(120,.3,'sawtooth',.15,.4);},
  four(){this.noise(1.1,.22,900,'lowpass',true);},
  six(){this.noise(1.8,.32,1100,'lowpass',true);this.tone(660,.18,'triangle',.08,1.5);},
  wide(){this.tone(900,.12,'square',.05);},
  out(){this.noise(.5,.3,500,'lowpass');this.tone(220,.4,'sawtooth',.1,.5);},
  whoosh(){this.noise(.18,.12,700,'bandpass');}
};

/* ===== field geometry =====
   Coordinates in metres: x = towards off side (right of screen), d = distance from the batter's stumps towards the bowler.
   Angles: 0 = straight down the ground, +90 = point side, -90 = square leg, 180 = behind the wicket. */
const PITCH=20.12, CD=10.06, RB=64;
function ropeDist(th){const c=Math.cos(rad(th)),b=CD*c;return b+Math.sqrt(Math.max(0,b*b-CD*CD+RB*RB));}
const FIELDS={
  att:[[158,14],[150,18],[122,18],[88,22],[52,24],[20,26],[-22,26],[-58,26],[-95,22]],
  bal:[[155,14],[85,26],[50,33],[15,58],[-15,58],[-58,34],[-92,58],[-155,48],[125,52]],
  def:[[20,60],[-20,60],[55,58],[95,58],[130,50],[-55,58],[-95,58],[-140,50],[35,30]]
};
const FNAMES={
  att:['Slip','Second slip','Gully','Point','Cover','Mid-off','Mid-on','Midwicket','Square leg'],
  bal:['Slip','Point','Cover','Long-off','Long-on','Midwicket','Deep square','Fine leg','Third man'],
  def:['Long-off','Long-on','Deep cover','Deep point','Third man','Deep midwicket','Deep square','Fine leg','Cover']
};
function makeField(k){
  return FIELDS[k].map((p,i)=>{const x=p[1]*Math.sin(rad(p[0])),d=p[1]*Math.cos(rad(p[0]));return{name:FNAMES[k][i],th:p[0],r:p[1],x,d,hx:x,hd:d};});
}
const KEEPER={name:'Keeper',x:.3,d:-10};
function rayInfo(th,f){const s=Math.sin(rad(th)),c=Math.cos(rad(th)),t=f.x*s+f.d*c;return{t,perp:Math.hypot(f.x-t*s,f.d-t*c)};}
/* clearance of an aim angle: how far the nearest fielder on that line is from it (used by the AI batter) */
function clearance(th,field,D){let m=40;for(const f of field){const r=rayInfo(th,f);if(r.t>6&&r.t<D)m=Math.min(m,r.perp);}return m;}

/* ===== delivery physics ===== */
function makeDelivery(o){
  return{d0:19.8,db:o.db,v:o.v,turn:o.turn,xr:o.xr,xb:o.xb,h0:o.type==='spin'?1.9:2.15,hAt:.08+.115*o.db,type:o.type,
    xFinal:o.xb+o.turn,hasBounced:false};
}
function ballAt(del,d){
  if(d>=del.db){const u=clamp((del.d0-d)/(del.d0-del.db),0,1);return{x:lerp(del.xr,del.xb,u),h:del.h0*(1-u)*(1-u)};}
  const u=clamp((del.db-d)/del.db,0,1);
  return{x:del.xb+del.turn*u,h:del.hAt*(1-(1-u)*(1-u))};
}

/* ===== ball missed or left alone ===== */
function resolvePass(del,swung,diff){
  const b=ballAt(del,0),x=b.x,h=b.h;
  const o={runs:0,wk:null,extra:null,boundary:0,kind:'pass',txt:'',miss:swung,beaten:swung};
  if(!swung&&(x>1.08||x<-1.25||h>2.1)){o.extra='wd';o.txt=Math.abs(x)>1?'Wide down the '+(x>0?'off':'leg')+' side.':'Too high, called wide.';return o;}
  if(Math.abs(x)<=.145&&h<.78){o.wk='bowled';o.txt=swung?'Through the gate! Clean bowled.':'Left it alone, and it hits the stumps.';return o;}
  if(x>-.5&&x<.15&&h<.6&&rnd()<(swung?.38:.3)*(del.type==='spin'?1.2:1)){o.wk='lbw';o.txt='Hit on the pads, plumb in front. Given out.';return o;}
  o.txt=swung?pick(['Swings and misses.','Beaten all ends up.','Played and missed.']):pick(['Left alone.','Shoulders arms.','Watchful, lets it go through.']);
  return o;
}

/* ===== bat meets ball =====
   I = {q, aim, loft, bx, db}, field = fielders. Returns an outcome with the path the ball takes afterwards. */
function groundShot(th,D,field,o,sk){
  const rope=ropeDist(th);let best=null;
  field.forEach((f,i)=>{const r=rayInfo(th,f);if(r.t>3&&r.t<D&&r.perp<(D<35?7:4.8)){if(!best||r.t<best.t)best={i,t:r.t};}});
  o.loft=false;
  if(best){
    o.fielder=best.i;o.endD=best.t;
    if(rnd()<.1){o.runs=2;o.endD=Math.min(rope,best.t+14);o.txt='Misfield! '+field[best.i].name+' lets it through.';}
    else{o.runs=best.t<20?(rnd()<.3?1:0):best.t<36?1:best.t<52?2:3;
      if(o.runs===3)o.runs=2;
      o.txt=o.runs===0?'Straight to '+field[best.i].name+'. No run.':'Fielded by '+field[best.i].name+', '+(o.runs===1?'a single.':o.runs+' runs.');
      if(o.runs>=2&&rnd()<.05){o.wk='run out';o.runs=1;o.txt='Direct hit! Run out going for the second.';}}
    return;
  }

  o.endD=D;o.runs=D<28?1:D<46?2:3;o.txt=o.runs===1?'Worked into the gap for a single.':o.runs+' runs, good running.';
}
function aerialShot(th,D2,field,o,peakBoost){
  const rope=ropeDist(th),lx=D2*Math.sin(rad(th)),ld=D2*Math.cos(rad(th));
  let bi=-1,bd=99;field.forEach((f,i)=>{const d=Math.hypot(f.x-lx,f.d-ld);if(d<bd){bd=d;bi=i;}});
  o.loft=true;o.peak=clamp(D2*.34*(peakBoost||1),4,20);

    o.runs=6;o.boundary=6;o.endD=D2;o.txt=pick(['SIX! Into the stands.','Launched! Maximum.','Over the rope, six runs.']);return;
  }
  const pc=bd<2.4?.9:bd<4.5?.62:bd<7?.28:bd<10?.08:0;
  if(rnd()<pc){o.wk='caught';o.fielder=bi;o.endD=D2;o.txt='Skied, and '+field[bi].name+' takes the catch.';return;}
  if(pc>.5&&rnd()<.5){o.dropped=true;}
  o.fielder=-1;
  if(D2>rope*.78){o.runs=4;o.boundary=4;o.endD=rope;o.txt='Lands safe and rolls away for four.';}
  else{o.runs=D2>38?3:D2>22?2:1;o.endD=D2;o.txt=(o.dropped?'Dropped by '+field[bi].name+'! ':'Lands safe, ')+o.runs+(o.runs===1?' run.':' runs.');}

function resolveShot(I,field){
  let q=I.q,th=I.aim;const loft=I.loft;
  const o={runs:0,wk:null,extra:null,boundary:0,kind:'shot',th,loft,endD:20,fielder:-1,q:I.q,edge:false,txt:'',peak:0};
  const off=I.bx;
  if(Math.abs(off)>.6)q*=Math.max(.35,1-(Math.abs(off)-.6)*.9);
  if(off>.45&&th<-25)q*=.78;
  if(off<-.05&&th>25)q*=.82;
  if(I.db<1.9)q*=loft?.6:.8;
  if(I.db>7.8&&loft&&th<-20)q=Math.min(1,q*1.12);
  if(I.db>2.2&&I.db<4.2&&!loft&&Math.abs(th)<35)q=Math.min(1,q*1.1);
  q=clamp(q,0,1);o.q=q;
  th=I.aim+randn()*(1-q)*14;o.th=th;
  if(q<.28){
    o.edge=true;const r=rnd();
    if(r<.5){
      o.th=off>=0?rr(140,172):rr(-172,-140);th=o.th;o.loft=false;
      if(rnd()<.4+(1-q)*.3){o.wk=rnd()<.6?'caught behind':'caught';o.fielder=o.wk==='caught'?0:-2;o.endD=12;o.txt=o.wk==='caught behind'?'Thin edge, and the keeper takes it!':'Edged to slip, a sharp catch!';}
      else if(rnd()<.3){o.runs=4;o.boundary=4;o.endD=ropeDist(th);o.txt='Edged, and it flies past slip for four.';}
      else{o.runs=rnd()<.5?0:1;o.endD=18;o.txt='Edged, but it falls short of the slips.';}
    }else if(r<.78){
      o.th=rr(-60,60);o.loft=false;
      if(rnd()<.25){o.wk='bowled';o.txt='Inside edge onto the stumps. Bowled!';}
      else{o.runs=rnd()<.6?0:1;o.endD=9;o.txt='Inside edge, rolls to leg. '+(o.runs?'A leg-bye single.':'No run.');}
    }else{aerialShot(th+rr(-40,40),rr(10,24),field,o,1.6);o.txt='Top edge! '+o.txt;}
    return o;
  }
  if(q<.55){
    if(loft){aerialShot(th,12+q*45,field,o,1.4);o.txt='Mistimed. '+o.txt;}
    else{groundShot(th,8+q*30,field,o);}
    return o;
  }
  const p=(q-.55)/.45;
  if(loft)aerialShot(th,28+p*62+randn()*5,field,o);
  else groundShot(th,22+p*58+randn()*4,field,o);
  return o;
}

/* ===== settings & runtime state ===== */
const S=Object.assign({overs:5,diff:'med',team:0},store.get('settings',{}));
if(![2,5,10,20].includes(S.overs))S.overs=5;
if(!['easy','med','hard'].includes(S.diff))S.diff='med';
if(!(Number.isInteger(S.team)&&S.team>=0&&S.team<4))S.team=0;
const DIFF={easy:{spd:.84,win:1.3,bat:-.08,hint:true,name:'Easy'},med:{spd:1,win:1,bat:0,hint:false,name:'Medium'},hard:{spd:1.13,win:.82,bat:.07,hint:false,name:'Hard'}};
const BASE_V={fast:19,medium:16,spin:12.5};
const LEN_DB={yorker:1.0,full:3.1,good:6.1,short:9.2};
const FIELD_NAME={att:'Attacking',bal:'Balanced',def:'Defensive'};
const G={phase:'menu',t:0,wait:0,del:null,ball:{d:19.8,x:0,h:2,v:0},trail:[],swing:null,plan:null,res:null,hit:null,
  field:makeField('bal'),fieldKey:'bal',bowler:null,sel:{len:'good',spd:'stock',line:.25,field:'bal'},fx:[],aim:0,loft:false,
  lastShot:null,stumpsDown:0,shake:0,spinSign:1};
let M=null;

/* ===== match setup ===== */
function newMatch(mode,toss){
  const ai=pick([0,1,2,3].filter(i=>i!==S.team));
  M={mode,practice:mode==='nets',overs:mode==='nets'?999:S.overs,t:[genTeam(S.team),genTeam(ai)],inn:[],cur:-1,target:0,comm:[],over:false,userBatsFirst:true};
  return M;
}
function curInn(){return M&&M.cur>=0?M.inn[M.cur]:null;}
function userBatting(){const i=curInn();return !!i&&i.batSide===0;}
function startInnings(idx,batSide){
  const bat=M.t[batSide];
  const inn={idx,batSide,bowlSide:1-batSide,runs:0,wk:0,balls:0,extras:0,
    order:bat.players.map(p=>({i:p.i,name:p.name,skill:p.bat,runs:0,balls:0,f:0,s:0,out:null})),
    striker:0,non:1,next:2,bs:{},cur:-1,prev:-1,chips:[],fow:[],over:0,overOpen:false,done:false};
  M.inn[idx]=inn;M.cur=idx;M.comm=[];
  G.fx=[];G.lastShot=null;

}
function bowlersOf(inn){return M.t[inn.bowlSide].players.filter(p=>p.bowl);}
function quota(){return M.practice?999:Math.ceil(M.overs/5);}
function oversBowled(inn,i){return inn.bs[i]?Math.floor(inn.bs[i].balls/6):0;}
function eligible(inn){
  let c=bowlersOf(inn).filter(p=>p.i!==inn.prev&&oversBowled(inn,p.i)<quota());
  if(!c.length)c=bowlersOf(inn).filter(p=>oversBowled(inn,p.i)<quota());
  if(!c.length)c=bowlersOf(inn);

}
function aiFieldFor(inn){

  if(M.practice)return'bal';

}
function beginOver(){
  const inn=curInn();inn.over=Math.floor(inn.balls/6);inn.chips=[];inn.overOpen=true;
  if(inn.bowlSide===1){ // AI bowls, user bats
    const c=eligible(inn),tot=c.reduce((s,p)=>s+p.bowl.skill+.2,0);let r=rnd()*tot,b=c[0];
    for(const p of c){r-=p.bowl.skill+.2;if(r<=0){b=p;break;}}
    inn.cur=b.i;G.bowler=b;G.fieldKey=aiFieldFor(inn);G.field=makeField(G.fieldKey);G.spinSign=rnd()<.5?1:-1;

}
function setBowler(p){

/* ===== ball set-up ===== */
function resetFielders(){G.field.forEach(f=>{f.x=f.hx;f.d=f.hd;});}

function aiDelivery(b){

  const spd=s.spd==='slow'?.82:s.spd==='quick'?1.1:1,err=s.spd==='quick'?1.35:s.spd==='slow'?.85:1;
  const db=Math.max(.45,LEN_DB[s.len]+randn()*.5*(1.3-sk)*err);

}
function startBowl(){
  if(G.phase!=='ready')return;

  G.del=userDelivery();G.phase='runup';G.t=0;setControls('wait');$('hint').textContent='';
}

/* ===== AI batter ===== */
function aiBatPlan(del,bowler){
  const inn=curInn(),bt=inn.order[inn.striker],dd=DIFF[S.diff],x=del.xFinal;
  let hard=0;
  if(Math.abs(x-.1)<.35)hard+=.1;
  if(del.db<1.9)hard+=.2;else if(del.db<4.5)hard+=.04;else if(del.db<7.2)hard+=.1;else if(del.db>8)hard-=.05;
  if(Math.abs(del.turn)>.4)hard+=.08;
  hard+=(bowler.bowl.skill-.65)*.35;
  hard+=(del.v-16)*.006;
  const base=.52+(bt.skill-.6)*.55+dd.bat+Math.min(.08,bt.balls*.01)-hard;
  const q=clamp(base+randn()*.2,0,1);
  const wide=x>1.08||x<-1.25;
  let aggr=0;
  if(inn.idx===1){const left=Math.max(1,M.overs*6-inn.balls),need=M.target-inn.runs;aggr=clamp((need/left*6-7)/14,-.1,.45);}
  else aggr=inn.over>=M.overs-2?.18:0;
  const loft=rnd()<clamp(.2+aggr+(bt.skill>.7?.05:0),.05,.7);
  let aim=0,best=-9;
  for(let k=0;k<8;k++){const th=rr(-95,100),c=clearance(th,G.field,60)+randn()*(8-bt.skill*5);if(c>best){best=c;aim=th;}}
  return{play:!wide||rnd()<.25,q:wide?q*.6:q,aim,loft};
}

/* ===== frame update ===== */
const RUNUP=.85;
function ballSpeed(){const del=G.del;return del.hasBounced?del.v*.86:del.v;}
function update(dt){
  G.shake=Math.max(0,G.shake-dt*2.5);
  G.fx=G.fx.filter(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;return p.t<p.life;});
  if(G.phase==='runup'){
    G.t+=dt;
    if(G.t>=RUNUP){G.phase='flight';G.t=0;G.ball={d:G.del.d0,x:G.del.xr,h:G.del.h0,v:G.del.v};
      if(!userBatting())G.plan=aiBatPlan(G.del,G.bowler);
      Snd.whoosh();}
  }else if(G.phase==='flight'){
    const del=G.del,step=ballSpeed()*dt;
    G.ball.d-=step;
    if(!del.hasBounced&&G.ball.d<=del.db){del.hasBounced=true;Snd.tone(110,.05,'sine',.12);}
    const b=ballAt(del,Math.max(G.ball.d,0));G.ball.x=b.x;G.ball.h=b.h;
    G.trail.push({d:G.ball.d,x:b.x,h:b.h});if(G.trail.length>7)G.trail.shift();
    if(G.swing){
      G.swing.t+=dt;
      if(!G.swing.done&&G.swing.t>=G.swing.delay){G.swing.done=true;userContact();}
    }else if(G.plan&&G.plan.play&&G.ball.d<=1.0&&!G.plan.done){G.plan.done=true;aiContact();}
    if(G.phase==='flight'&&G.ball.d<=-.2)ballPassed();
  }else if(G.phase==='hit'){
    G.hit.t+=dt;
    const h=G.hit;
    if(h.fielder>=0&&G.field[h.fielder]){const f=G.field[h.fielder],k=clamp(h.t/(h.dur*.85),0,1),ex=h.endD*Math.sin(rad(h.th)),ed=h.endD*Math.cos(rad(h.th));f.x=lerp(f.hx,ex,k);f.d=lerp(f.hd,ed,k);}
    if(h.t>=h.dur)finishBall();
  }else if(G.phase==='post'){
    G.wait-=dt;if(G.wait<=0)proceed();
  }
}

/* ===== contacts ===== */
function userContact(){
  const del=G.del,sw=G.swing,d=G.ball.d;
  if(G.phase!=='flight'||d<=-.2){sw.missed=true;return;}
  const bt=curInn().order[curInn().striker],v=ballSpeed();
  const err=(d-1.0)/v,W=(.17+(bt.skill-.6)*.1)*DIFF[S.diff].win;
  if(Math.abs(err)>W){sw.missed=true;return;}
  const q=1-Math.pow(Math.abs(err)/W,1.3);
  sw.err=err;
  startHit(resolveShot({q,aim:sw.aim,loft:sw.loft,bx:G.ball.x,db:del.db},G.field),q);
}
function aiContact(){
  const p=G.plan,del=G.del;
  if(p.q<.08){G.swing={t:0,delay:0,done:true,missed:true,aim:0,loft:false};return;}
  G.swing={t:0,delay:0,done:true,aim:p.aim,loft:p.loft,ai:true};
  startHit(resolveShot({q:p.q,aim:p.aim,loft:p.loft,bx:G.ball.x,db:del.db},G.field),p.q);

function ballPassed(){
  const o=resolvePass(G.del,!!G.swing,S.diff);

function startHit(o,q){

  const th=o.th,endD=o.endD||15;

    dur:.55+Math.min(endD,70)*.011+(o.loft?.35:0),boundary:o.boundary};
  if(o.wk==='bowled'){G.stumpsDown=1;G.shake=1;Snd.stumps();G.hit.dur=.8;}
  else if(o.edge)Snd.edge();else Snd.hit(q);

/* ===== ball outcome → scoring ===== */

function burst(n){
  for(let i=0;i<n;i++)G.fx.push({x:.5+rr(-.1,.1),y:.4,vx:rr(-.5,.5),vy:rr(-.8,-.1),g:1.2,life:rr(.8,1.5),t:0,c:pick(['#f0bf55','#e0412f','#fff','#35c2d6'])});

function logComm(txt,o){
  const inn=curInn(),b=inn.order[inn.striker],bw=G.bowler;

  M.comm.push((o.wk?'OUT! ':o.boundary===6?'SIX! ':o.boundary===4?'FOUR! ':'')+bw.name.split(' ')[1]+' to '+b.name.split(' ')[1]+': '+txt);

function applyOutcome(o){

    inn.chips.push({t:'W',c:'w'});
    if(M.practice){const p={i:inn.order.length,name:pick(FIRST)+' '+pick(LAST),skill:.72,runs:0,balls:0,f:0,s:0,out:null};inn.order.push(p);inn.striker=inn.order.length-1;inn.wk=0;}
    else if(inn.wk<10){inn.striker=inn.next++;}

    if(r%2===1){const t=inn.striker;inn.striker=inn.non;inn.non=t;}

function checkEnd(){

function proceed(){

/* ===== innings & match end ===== */
function endInnings(){

  else finishMatch();
}
function finishMatch(){

  else if(b.runs<a.runs){res=nm(a.batSide)+' won by '+(a.runs-b.runs)+' run'+(a.runs-b.runs===1?'':'s');userWon=a.batSide===0;}

/* ===== rendering ===== */
const cv=$('cv'),cx=cv.getContext('2d');
const V={W:300,H:300,dpr:1,yH:90,yB:270,sc:40};
let crowd=[];
function resize(){
  const r=cv.getBoundingClientRect();V.dpr=Math.min(2,window.devicePixelRatio||1);
  V.W=Math.max(100,r.width);V.H=Math.max(100,r.height);
  cv.width=Math.round(V.W*V.dpr);cv.height=Math.round(V.H*V.dpr);cx.setTransform(V.dpr,0,0,V.dpr,0,0);
  V.yH=V.H*.3;V.yB=V.H*.9;V.sc=Math.min(V.W*.15,V.H*.2);
  const R=mulberry(7);crowd=[];const n=Math.round(V.W/3);
  for(let i=0;i<n*4;i++)crowd.push({x:R(),y:R(),c:['#f0bf55','#e0412f','#35c2d6','#eef1fb','#9bdc6a','#c46bd8'][Math.floor(R()*6)]});
}
function P(x,d,h){const s=1/(1+Math.max(d,-6)/9);return{x:V.W/2+x*V.sc*s,y:V.yH+(V.yB-V.yH)*s-(h||0)*V.sc*s,s};}
function line(a,b,w,c){cx.strokeStyle=c;cx.lineWidth=w;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();}
function figure(x,d,shirt,pants,helm,pose){
  const p=P(x,d,0),u=V.sc*p.s;if(p.y-u*2>V.H+20||p.s<=0)return;
  cx.fillStyle='rgba(0,0,0,.28)';cx.beginPath();cx.ellipse(p.x,p.y,.42*u,.1*u,0,0,6.3);cx.fill();
  cx.lineCap='round';
  line({x:p.x-.1*u,y:p.y-.85*u},{x:p.x-.14*u,y:p.y},Math.max(1.5,.14*u),pants);
  line({x:p.x+.1*u,y:p.y-.85*u},{x:p.x+.14*u,y:p.y},Math.max(1.5,.14*u),pants);
  cx.fillStyle=shirt;cx.beginPath();cx.roundRect?cx.roundRect(p.x-.25*u,p.y-1.6*u,.5*u,.8*u,.1*u):cx.rect(p.x-.25*u,p.y-1.6*u,.5*u,.8*u);cx.fill();
  cx.fillStyle='#d9a47a';cx.beginPath();cx.arc(p.x,p.y-1.75*u,.15*u,0,6.3);cx.fill();
  cx.fillStyle=helm;cx.beginPath();cx.arc(p.x,p.y-1.8*u,.16*u,3.14,6.28);cx.fill();
  if(pose==='arm'){line({x:p.x+.2*u,y:p.y-1.5*u},{x:p.x+.3*u,y:p.y-2.1*u},Math.max(1.5,.1*u),shirt);}
}
function drawWorld(){
  const W=V.W,H=V.H;
  // sky
  let g=cx.createLinearGradient(0,0,0,V.yH);g.addColorStop(0,'#1b2461');g.addColorStop(.55,'#6a4a96');g.addColorStop(1,'#f08a5c');
  cx.fillStyle=g;cx.fillRect(0,0,W,V.yH+2);
  // floodlight glows
  [[.1,.55],[.9,.55],[.3,.35],[.7,.35]].forEach(a=>{const x=W*a[0],y=V.yH*a[1],gr=cx.createRadialGradient(x,y,0,x,y,V.sc*1.6);gr.addColorStop(0,'rgba(255,248,214,.9)');gr.addColorStop(.25,'rgba(255,236,170,.35)');gr.addColorStop(1,'rgba(255,236,170,0)');cx.fillStyle=gr;cx.fillRect(x-V.sc*2,y-V.sc*2,V.sc*4,V.sc*4);
    cx.fillStyle='#1a1f3f';cx.fillRect(x-1.5,y,3,V.yH-y+V.H*.03);});
  // stands + crowd
  const y0=P(0,78,0).y,sy=V.yH-V.H*.07;
  cx.fillStyle='#161c42';cx.fillRect(0,sy,W,y0-sy+2);
  const bh=y0-sy;
  for(const c of crowd){cx.fillStyle=c.c;cx.globalAlpha=.75;cx.fillRect(c.x*W,sy+c.y*bh,2,2);}
  cx.globalAlpha=1;
  // grass stripes
  for(let d=-8,i=0;d<80;d+=6,i++){
    const a=P(0,d,0).y,b=P(0,d+6,0).y;if(b>a)continue; // far strips have smaller y
    cx.fillStyle=i%2?'#2a8049':'#2f8e52';
    const top=Math.max(b,y0),bot=Math.min(a,H+4);if(bot>top)cx.fillRect(0,top,W,bot-top+1);
  }
  // boundary rope
  cx.strokeStyle='rgba(255,255,255,.85)';cx.lineWidth=2;cx.beginPath();let pen=false;
  for(let a=0;a<=360;a+=4){const x=RB*Math.sin(rad(a)),d=CD+RB*Math.cos(rad(a));if(d<-4){pen=false;continue;}const p=P(x,d,0);if(!pen){cx.moveTo(p.x,p.y);pen=true;}else cx.lineTo(p.x,p.y);}
  cx.stroke();
  // pitch
  const c1=P(-1.52,-1.6,0),c2=P(1.52,-1.6,0),c3=P(1.52,21.8,0),c4=P(-1.52,21.8,0);
  cx.fillStyle='#cdb584';cx.beginPath();cx.moveTo(c1.x,c1.y);cx.lineTo(c2.x,c2.y);cx.lineTo(c3.x,c3.y);cx.lineTo(c4.x,c4.y);cx.closePath();cx.fill();
  [1.22,PITCH-1.22].forEach(d=>line(P(-1.8,d,0),P(1.8,d,0),Math.max(1,.04*V.sc*P(0,d).s*3),'rgba(255,255,255,.9)'));
  line(P(-1.52,-1.6,0),P(-1.52,21.8,0),1,'rgba(255,255,255,.35)');line(P(1.52,-1.6,0),P(1.52,21.8,0),1,'rgba(255,255,255,.35)');
}
function stumps(d,fallen){
  const lw=Math.max(1.4,.05*V.sc*P(0,d).s*1.6);
  for(const x of[-.09,0,.09]){
    const a=P(x,d,0);let top=P(x,d,.71);
    if(fallen){const k=Math.min(1,G.hit?G.hit.t*3:1);top={x:a.x+(x*3+.25)*V.sc*a.s*k,y:a.y-.71*V.sc*a.s*(1-.75*k)};}
    line(a,top,lw,'#f4eedc');
  }
  if(!fallen){line(P(-.1,d,.73),P(.1,d,.73),lw*.8,'#e0412f');}
  else{const a=P(.3,d,.1+(G.hit?Math.min(.5,G.hit.t):0));cx.fillStyle='#e0412f';cx.fillRect(a.x,a.y,Math.max(3,lw*2),Math.max(1.5,lw*.6));}
}
function ballDraw(x,d,h,r){
  const p=P(x,d,h),sh=P(x,d,0),rad_=Math.max(2.4,r*V.sc*p.s);
  cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.ellipse(sh.x,sh.y,rad_*1.2,rad_*.4,0,0,6.3);cx.fill();
  cx.fillStyle='#e0412f';cx.beginPath();cx.arc(p.x,p.y,rad_,0,6.3);cx.fill();
  cx.strokeStyle='rgba(255,255,255,.55)';cx.lineWidth=Math.max(.6,rad_*.18);cx.beginPath();cx.arc(p.x,p.y,rad_*.7,.5,2.4);cx.stroke();
}
function hitBallPos(){
  const h=G.hit;if(!h||h.kind!=='shot')return null;
  const u=clamp(h.t/h.dur,0,1),e=1-(1-u)*(1-u),dist=h.endD*e;
  let ht;
  if(h.loft)ht=.9*(1-u)+h.peak*4*u*(1-u);
  else ht=.12+Math.abs(Math.sin(u*9.4))*.3*(1-u);
  return{x:.1+dist*Math.sin(rad(h.th)),d:.8+dist*Math.cos(rad(h.th)),h:ht,u};
}
function render(){
  const W=V.W,H=V.H;
  cx.save();
  if(G.shake>0)cx.translate((rnd()-.5)*8*G.shake,(rnd()-.5)*8*G.shake);
  drawWorld();
  const inn=curInn();
  const batTeam=inn?M.t[inn.batSide].team:TEAMS[S.team],bowlTeam=inn?M.t[inn.bowlSide].team:TEAMS[(S.team+1)%4];
  // far stumps
  stumps(PITCH,false);
  // fielders sorted far to near
  const fl=G.field.slice().sort((a,b)=>b.d-a.d);
  for(const f of fl)figure(f.x,f.d,bowlTeam.c1,'#f2f2f2',bowlTeam.c2);
  // umpire + bowler
  figure(-1.9,PITCH+1.3,'#e8e8e8','#222','#222');
  let bd=26,pose='';
  if(G.phase==='runup')bd=lerp(26,20.9,clamp(G.t/RUNUP,0,1));
  else if(G.phase==='flight'||G.phase==='hit'||G.phase==='post'){bd=20.6;pose='arm';}
  figure(.6,bd,bowlTeam.c1,'#f2f2f2',bowlTeam.c2,pose);
  // bounce hint
  if(inn&&userBatting()&&DIFF[S.diff].hint&&G.del&&(G.phase==='runup'||G.phase==='flight')&&!G.del.hasBounced){
    const p=P(G.del.xb,G.del.db,0),pr=1+.15*Math.sin(performance.now()/120);
    cx.strokeStyle='rgba(255,255,255,.8)';cx.lineWidth=2;cx.beginPath();cx.ellipse(p.x,p.y,.34*V.sc*p.s*pr,.12*V.sc*p.s*pr,0,0,6.3);cx.stroke();
  }
  // near stumps
  stumps(0,G.stumpsDown>0);
  // ball
  if(G.phase==='flight'){
    G.trail.forEach((t,i)=>{cx.globalAlpha=(i+1)/G.trail.length*.35;ballDraw(t.x,t.d,t.h,.11);});cx.globalAlpha=1;
    ballDraw(G.ball.x,G.ball.d,G.ball.h,.13);
  }else if(G.phase==='hit'||G.phase==='post'){
    const bp=hitBallPos();
    if(bp&&bp.u<1)ballDraw(bp.x,bp.d,bp.h,.13);
    else if(G.hit&&G.hit.kind==='pass'&&G.hit.t<.2){ballDraw(G.ball.x,Math.max(G.ball.d,0),G.ball.h,.13);}
  }
  // batter + bat
  const ist=inn?M.t[inn.batSide].team:batTeam;
  figure(-.62,0,ist.c1,'#f2f2f2',ist.c2);
  {
    const hand=P(-.45,.1,1.0),u=V.sc;let k=0,ang=-1.95;
    const sw=G.swing;
    if(sw){const T=.26;k=clamp((sw.ai?(G.hit?G.hit.t+.05:.05):sw.t)/T,0,1);ang=lerp(-2.2,.7,k);}
    else if(G.phase==='runup'||G.phase==='flight')ang=-1.95+Math.sin(performance.now()/260)*.04;
    const L=1.0*u;
    line(hand,{x:hand.x+Math.cos(ang)*L,y:hand.y+Math.sin(ang)*L},Math.max(4,.11*u),'#caa066');
    line(hand,{x:hand.x+Math.cos(ang)*L*.25,y:hand.y+Math.sin(ang)*L*.25},Math.max(3,.07*u),'#3a2a1a');
  }
  // particles
  for(const p of G.fx){cx.globalAlpha=clamp(1-p.t/p.life,0,1);cx.fillStyle=p.c;cx.fillRect(p.x*W,p.y*H,5,5);}
  cx.globalAlpha=1;
  drawMini();
  cx.restore();
}
function drawMini(){
  const size=Math.min(V.W*.3,120),x0=V.W-size-8,y0=8,k=size/2/(RB+6),cxm=x0+size/2,cym=y0+size/2;
  const mx=x=>cxm+x*k,my=d=>cym-(d-CD)*k;
  cx.save();
  cx.fillStyle='rgba(10,18,40,.55)';cx.beginPath();cx.arc(cxm,cym,size/2,0,6.3);cx.fill();
  cx.fillStyle='rgba(46,139,87,.75)';cx.beginPath();cx.arc(cxm,cym,RB*k,0,6.3);cx.fill();
  cx.strokeStyle='rgba(255,255,255,.7)';cx.lineWidth=1;cx.stroke();
  cx.fillStyle='#cdb584';cx.fillRect(mx(-1.5),my(PITCH),3*k,PITCH*k);
  const inn=curInn(),bt=inn?M.t[inn.bowlSide].team:TEAMS[1];
  // aim cone while batting
  if(inn&&userBatting()&&(G.phase==='runup'||G.phase==='flight')){
    const a=G.aim,len=RB*.9;
    cx.fillStyle='rgba(240,191,85,.28)';cx.beginPath();cx.moveTo(mx(0),my(0));
    cx.lineTo(mx(len*Math.sin(rad(a-9))),my(len*Math.cos(rad(a-9))));cx.lineTo(mx(len*Math.sin(rad(a+9))),my(len*Math.cos(rad(a+9))));cx.closePath();cx.fill();
    cx.strokeStyle='#f0bf55';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(mx(0),my(0));cx.lineTo(mx(len*Math.sin(rad(a))),my(len*Math.cos(rad(a))));cx.stroke();
  }
  if(G.lastShot&&G.phase!=='ready'){
    const s=G.lastShot,e=Math.min(1,G.phase==='hit'&&G.hit?G.hit.t/G.hit.dur:1);
    cx.strokeStyle=s.boundary===6?'#f0bf55':s.boundary===4?'#fff':'rgba(255,255,255,.7)';cx.lineWidth=2;cx.beginPath();cx.moveTo(mx(0),my(0));
    cx.lineTo(mx(s.endD*e*Math.sin(rad(s.th))),my(s.endD*e*Math.cos(rad(s.th))));cx.stroke();
  }
  for(const f of G.field){cx.fillStyle=bt.c1;cx.beginPath();cx.arc(mx(f.x),my(f.d),2.6,0,6.3);cx.fill();}
  cx.fillStyle=bt.c1;cx.fillRect(mx(KEEPER.x)-2,my(KEEPER.d)-2,4,4);
  cx.fillStyle='#fff';cx.beginPath();cx.arc(mx(0),my(0),2,0,6.3);cx.fill();
  cx.restore();
}

function renderComm(){$('comm').innerHTML=(M?M.comm.slice(-3):[]).map(l=>'<div>'+esc(l)+'</div>').join('');}
const sh=n=>{const p=String(n).split(' ');return p[0][0]+'. '+p.slice(1).join(' ');};

function hud(){

function doToss(call){
  const flip=rnd()<.5?'heads':'tails',won=flip===call;
  if(won){overlay('<div class="card"><h2>It is '+flip+'. You won the toss.</h2><p>What will you do?</p><div class="row"><button type="button" class="btn primary" data-act="choose" data-v="bat" style="flex:1">Bat first</button><button type="button" class="btn primary" data-act="choose" data-v="bowl" style="flex:1">Bowl first</button></div></div>');}
  else{const bat=rnd()<.45;overlay('<div class="card"><h2>It is '+flip+'. '+esc(M.t[1].team.name)+' won the toss.</h2><p>They chose to '+(bat?'bat':'bowl')+' first.</p><button type="button" class="btn primary" data-act="choose" data-v="'+(bat?'bowl':'bat')+'">Play</button></div>');}
}
function beginMatch(userBats){M.userBatsFirst=userBats;hideOverlay();startInnings(0,userBats?0:1);}
function showBowlerPicker(inn){
  const ok=new Set(eligible(inn).map(p=>p.i)),q=quota();
  const rows=bowlersOf(inn).map(p=>{
    const s=inn.bs[p.i]||{balls:0,runs:0,wk:0},od=oversBowled(inn,p.i),can=ok.has(p.i);
    const why=can?'':(od>=q?'Quota used':'Bowled last over');
    const fig=oversText(s.balls)+'-'+s.runs+'-'+s.wk;
    return'<button type="button" class="btn" '+(can?'data-act="bowler" data-i="'+p.i+'"':'disabled aria-disabled="true"')+' style="text-align:left;display:flex;justify-content:space-between;gap:10px;'+(can?'':'opacity:.5;cursor:default')+'"><span>'+esc(p.name)+' <span style="color:var(--mute)">('+p.bowl.type+')</span></span><span style="color:'+(can?'var(--brass)':'var(--mute)')+';text-align:right;white-space:nowrap;flex:none">'+(can?'★'.repeat(Math.round(p.bowl.skill*5))+' · ':esc(why)+' · ')+'<b>'+fig+'</b></span></button>';
  }).join('');
  overlay('<div class="card"><h2>Over '+(inn.over+1)+': pick your bowler</h2><p>'+esc(M.t[0].team.name)+' are in the field. '+oversText(inn.balls)+' overs bowled, '+inn.runs+'/'+inn.wk+'. Figures are overs-runs-wickets. Each bowler can bowl '+(M.practice?'any number of':q)+' over'+(q===1&&!M.practice?'':'s')+'.</p>'+rows+'</div>');
}
function teamLine(inn){return M.t[inn.batSide].team.name+' '+inn.runs+'/'+inn.wk+' ('+oversText(inn.balls)+')';}
function startSecond(){hideOverlay();startInnings(1,1-M.inn[0].batSide);}
function topPerf(inn){
  const bats=inn.order.filter(b=>b.balls||b.out).sort((x,y)=>y.runs-x.runs||x.balls-y.balls)[0];
  const bowls=Object.keys(inn.bs).map(k=>({n:M.t[inn.bowlSide].players[k].name,s:inn.bs[k]})).sort((x,y)=>y.s.wk-x.s.wk||x.s.runs-y.s.runs)[0];
  let h='';
  if(bats)h+='<div class="r"><span>Top scorer</span><span><b>'+esc(bats.name)+'</b> '+bats.runs+' ('+bats.balls+')</span></div>';
  if(bowls)h+='<div class="r"><span>Best bowler</span><span><b>'+esc(bowls.n)+'</b> '+oversText(bowls.s.balls)+'-'+bowls.s.runs+'-'+bowls.s.wk+'</span></div>';
  return h;
}
function showBreak(){
  const a=M.inn[0],userNext=a.batSide!==0;
  overlay('<div class="card"><h2>Innings break</h2><div class="big">'+esc(teamLine(a))+'</div>'
   +'<div style="display:grid;gap:4px;font-size:14px;color:var(--mute)">'+topPerf(a)+'</div>'
   +'<p>Target: <b style="color:var(--fg)">'+(a.runs+1)+'</b> runs from '+M.overs+' overs.</p>'
   +'<p>'+(userNext?'You chase. Get '+(a.runs+1)+' to win.':'You bowl. Defend '+a.runs+' to win.')+'</p>'
   +'<p>Take a breather. The match waits until you are ready.</p>'
   +'<div class="row"><button type="button" class="btn primary" data-act="next2" style="flex:2">Resume match</button><button type="button" class="btn" data-act="card" style="flex:1">Scorecard</button></div></div>');
}
function showResult(){
  const r=M.result,head=r.userWon===null?'Tied match':r.userWon?'You win!':'You lose';
  overlay('<div class="card"><h2>'+head+'</h2><div class="big">'+esc(r.text)+'</div><p>'+esc(teamLine(M.inn[0]))+'<br>'+esc(teamLine(M.inn[1]))+'</p>'
   +'<div class="row"><button type="button" class="btn primary" data-act="rematch" style="flex:1">Play again</button><button type="button" class="btn" data-act="card" style="flex:1">Scorecard</button><button type="button" class="btn" data-act="quit" style="flex:1">Menu</button></div></div>');
  cardBack=showResult;
}
function showCard(back){
  cardBack=back||null;
  let h='<div class="card"><h2>Scorecard</h2>';
  M.inn.forEach(inn=>{
    h+='<div><div class="big" style="font-size:26px">'+esc(teamLine(inn))+'</div><div class="scroll"><table><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th></tr>';
    inn.order.forEach((b,i)=>{if(b.balls||b.out||i===inn.striker||i===inn.non)h+='<tr><td>'+esc(b.name)+'<br><span style="color:var(--mute);font-size:11px">'+esc(b.out||'not out')+'</span></td><td>'+b.runs+'</td><td>'+b.balls+'</td><td>'+b.f+'</td><td>'+b.s+'</td></tr>';});
    h+='</table></div><div class="scroll"><table><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Wd</th></tr>';
    Object.keys(inn.bs).forEach(k=>{const s=inn.bs[k];h+='<tr><td>'+esc(M.t[inn.bowlSide].players[k].name)+'</td><td>'+oversText(s.balls)+'</td><td>'+s.runs+'</td><td>'+s.wk+'</td><td>'+s.wd+'</td></tr>';});
    h+='</table></div><p>Extras '+inn.extras+(inn.fow.length?' · Fall of wickets: '+esc(inn.fow.join(', ')):'')+'</p></div>';
  });
  overlay(h+'<button type="button" class="btn primary" data-act="closecard">Close</button></div>');
}
ov.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;Snd.init();Snd.click();
  const a=t.dataset.act,v=t.dataset.v;
  if(a==='set'){S[t.dataset.k]=t.dataset.k==='overs'?+v:v;store.set('settings',S);t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));}
  else if(a==='team'){S.team=+t.dataset.i;store.set('settings',S);ov.querySelectorAll('.team').forEach(b=>b.setAttribute('aria-pressed',b===t));}
  else if(a==='play'){newMatch('match');showToss();}
  else if(a==='nets'){newMatch('nets');hideOverlay();startInnings(0,0);}
  else if(a==='help'){showHelp();}
  else if(a==='back'){M?hideOverlay():showMenu();}
  else if(a==='helpback'){showHelp();}
  else if(a==='toss'){doToss(v);}
  else if(a==='choose'){beginMatch(v==='bat');}
  else if(a==='bowler'){setBowler(M.t[0].players[+t.dataset.i]);}
  else if(a==='next2'){startSecond();}
  else if(a==='rematch'){newMatch('match');showToss();}
  else if(a==='card'){showCard(ov.querySelector('[data-act=resume]')?showPause:(M.result?showResult:showBreak));}
  else if(a==='closecard'){if(cardBack)cardBack();else hideOverlay();}
  else if(a==='resume'){hideOverlay();}
  else if(a==='quit'){showMenu();}
});

/* ===== input ===== */
function userSwing(){
  if(!M||!userBatting()||(G.phase!=='runup'&&G.phase!=='flight')||G.swing)return;
  G.swing={t:0,delay:.12,aim:+$('aim').value,loft:G.loft,done:false};Snd.whoosh();
}
function setAim(v){v=clamp(v,-90,90);$('aim').value=v;G.aim=v;$('aimOut').textContent=aimLabel(v);}
function toggleLoft(){G.loft=!G.loft;$('loft').setAttribute('aria-pressed',G.loft);}
$('aim').addEventListener('input',()=>setAim(+$('aim').value));
$('loft').addEventListener('click',()=>{Snd.init();toggleLoft();});
$('swing').addEventListener('pointerdown',e=>{e.preventDefault();Snd.init();userSwing();});
cv.addEventListener('pointerdown',e=>{e.preventDefault();Snd.init();userSwing();});
$('bowl').addEventListener('click',()=>{Snd.init();startBowl();});
$('line').addEventListener('input',updateLineOut);
function segClick(id,key){$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;Snd.init();G.sel[key]=b.dataset.v;syncBowlUI();});}
segClick('segLen','len');segClick('segSpd','spd');segClick('segFld','field');
$('btnCard').addEventListener('click',()=>{if(M&&M.inn.length)showCard(()=>hideOverlay());});
$('btnMenu').addEventListener('click',()=>{Snd.init();if(M)showPause();else showMenu();});
$('btnMute').addEventListener('click',()=>{Snd.init();Snd.on=!Snd.on;$('btnMute').textContent=Snd.on?'Sound on':'Sound off';$('btnMute').setAttribute('aria-pressed',!Snd.on);});
document.addEventListener('keydown',e=>{
  if(!ov.hidden){if(e.key==='Escape'&&M&&!ov.querySelector('[data-act=toss],[data-act=choose],[data-act=bowler],[data-act=next2],[data-act=rematch]'))hideOverlay();return;}
  const k=e.key;Snd.init();
  if(k==='Escape'){if(M)showPause();return;}
  if(!M)return;
  if(userBatting()){
    if(k===' '||k==='Enter'){e.preventDefault();userSwing();}
    else if(k==='ArrowLeft'||k==='a'){setAim(+$('aim').value-8);}
    else if(k==='ArrowRight'||k==='d'){setAim(+$('aim').value+8);}
    else if(k==='ArrowUp'||k==='w'||k==='ArrowDown'||k==='s'){e.preventDefault();toggleLoft();}
  }else if(G.phase==='ready'){
    if(k===' '||k==='Enter'){e.preventDefault();startBowl();}
    else if(k>='1'&&k<='4'){G.sel.len=['yorker','full','good','short'][+k-1];syncBowlUI();}
    else if(k==='ArrowLeft'||k==='a'){G.sel.line=clamp(G.sel.line-.1,-1,1.4);syncBowlUI();}
    else if(k==='ArrowRight'||k==='d'){G.sel.line=clamp(G.sel.line+.1,-1,1.4);syncBowlUI();}
    else if(k==='f'||k==='F'){const o=['att','bal','def'];G.sel.field=o[(o.indexOf(G.sel.field)+1)%3];syncBowlUI();}
  }
});

/* ===== boot ===== */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(ov.hidden)update(dt);
  render();requestAnimationFrame(frame);
}
new ResizeObserver(resize).observe($('stage'));
window.addEventListener('resize',resize);
resize();setAim(0);showMenu();requestAnimationFrame(frame);
</script>
</body>
</html>
